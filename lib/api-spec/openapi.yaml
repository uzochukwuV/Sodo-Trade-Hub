openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sogram social trading platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Social feed operations
  - name: traders
    description: Trader profile operations
  - name: trades
    description: Trade post operations
  - name: signals
    description: Signal post operations
  - name: copy
    description: Copy trading operations
  - name: analytics
    description: Analytics and market data
  - name: leaderboard
    description: Leaderboard operations
  - name: stream
    description: Server-Sent Events realtime feed
  - name: accounts
    description: Sodex per-wallet REST passthroughs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get social feed (trades + signals)
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, wins, signals, losses, whales]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Feed items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /traders:
    get:
      operationId: listTraders
      tags: [traders]
      summary: List all traders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of traders
          content:
            application/json:
              schema:
                type: object
                properties:
                  traders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trader"
                required: [traders]
    post:
      operationId: createTrader
      tags: [traders]
      summary: Create or update a trader profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraderBody"
      responses:
        "201":
          description: Trader created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trader"

  /traders/{traderId}:
    get:
      operationId: getTrader
      tags: [traders]
      summary: Get a trader profile
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trader profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderProfile"
        "404":
          description: Trader not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /traders/{traderId}/reputation:
    get:
      operationId: getTraderReputation
      tags: [traders]
      summary: Get a trader's multi-dimensional reputation breakdown
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reputation breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationBreakdown"
        "404":
          description: Trader not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /traders/{traderId}/trades:
    get:
      operationId: getTraderTrades
      tags: [traders]
      summary: Get a trader's trade history
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
                required: [trades]

  /traders/{traderId}/follow:
    post:
      operationId: followTrader
      tags: [traders]
      summary: Follow a trader
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followerId:
                  type: integer
              required: [followerId]
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
    delete:
      operationId: unfollowTrader
      tags: [traders]
      summary: Unfollow a trader
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followerId:
                  type: integer
              required: [followerId]
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"

  /traders/{traderId}/followers:
    get:
      operationId: getTraderFollowers
      tags: [traders]
      summary: Get a trader's followers and following counts
      parameters:
        - name: traderId
          in: path
          required: true
          schema:
            type: integer
        - name: followerId
          in: query
          schema:
            type: integer
          description: Optional viewer ID to check if they follow this trader
      responses:
        "200":
          description: Follower info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderFollowStats"

  /comments/{postType}/{postId}:
    get:
      operationId: getComments
      tags: [feed]
      summary: Get comments for a post
      parameters:
        - name: postType
          in: path
          required: true
          schema:
            type: string
            enum: [trade, signal, pain_room, intent]
        - name: postId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                  total:
                    type: integer
                required: [comments, total]
    post:
      operationId: addComment
      tags: [feed]
      summary: Add a comment to a post
      parameters:
        - name: postType
          in: path
          required: true
          schema:
            type: string
            enum: [trade, signal, pain_room, intent]
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /valuechain/whales:
    get:
      operationId: getWhaleWallets
      tags: [analytics]
      summary: Get discovered whale wallets from ValueChain
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Whale wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhaleWalletEntry"
                required: [wallets]

  /valuechain/scan:
    post:
      operationId: scanValueChain
      tags: [analytics]
      summary: Scan ValueChain for new whale wallets interacting with Sodex contracts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: Optional specific address to scan. If omitted, scans recent Sodex contract interactions.
                label:
                  type: string
              required: []
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueChainScanResponse"

  /trades:
    post:
      operationId: createTrade
      tags: [trades]
      summary: Post a verified trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTradeBody"
      responses:
        "201":
          description: Trade posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{tradeId}/like:
    post:
      operationId: likeTrade
      tags: [trades]
      summary: Like a trade post
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: integer
                  liked:
                    type: boolean
                required: [likes, liked]

  /signals/{signalId}/resolve:
    post:
      operationId: resolveSignal
      tags: [signals]
      summary: Mark a signal as hit or stopped (fires reputation event)
      parameters:
        - name: signalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [hit, stopped]
              required: [outcome]
      responses:
        "200":
          description: Signal resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                required: [ok, status]
        "404":
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List trading signals with optional filters
      parameters:
        - name: asset
          in: query
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum: [LONG, SHORT]
        - name: status
          in: query
          description: |
            Defaults to `open` when omitted (and `traderId` is not set), so the
            Signals page only shows live setups. Pass `hit`/`stopped` for the
            other tabs, `all` to disable the status filter explicitly, or omit +
            set `traderId` to get every status for one trader's drill-down.
          schema:
            type: string
            enum: [open, hit, stopped, all]
            default: open
        - name: minConfidence
          in: query
          schema:
            type: integer
        - name: traderId
          in: query
          schema:
            type: integer
        - name: eliteOnly
          in: query
          description: |
            When true (default), only return signals from elite traders (tier
            DIAMOND/GOLD or 30d realized PnL ≥ $5,000). Pass `false` to
            include moderate traders too. Ignored when `traderId` is set.
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignalFull"
                  total:
                    type: integer
                required: [signals, total]
    post:
      operationId: createSignal
      tags: [signals]
      summary: Post a trading signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignalBody"
      responses:
        "201":
          description: Signal posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalFull"

  /signals/{signalId}/like:
    post:
      operationId: likeSignal
      tags: [signals]
      summary: Like a signal post
      parameters:
        - name: signalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: integer
                  liked:
                    type: boolean
                required: [likes, liked]

  /copy:
    get:
      operationId: listCopyConfigs
      tags: [copy]
      summary: Get all copy trading configurations for a copier
      parameters:
        - name: copierId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Copy configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CopyConfig"
                required: [configs]
    post:
      operationId: upsertCopyConfig
      tags: [copy]
      summary: Create or update a copy trading configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCopyConfigBody"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyConfig"

  /pain-rooms:
    get:
      operationId: listPainRooms
      tags: [pain-rooms]
      summary: List pain room posts (verified losses with community breakdowns)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Pain rooms list
          content:
            application/json:
              schema:
                type: object
                properties:
                  painRooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/PainRoom"
                  total:
                    type: integer
                required: [painRooms, total]
    post:
      operationId: createPainRoom
      tags: [pain-rooms]
      summary: Post a verified loss to the pain room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePainRoomBody"
      responses:
        "201":
          description: Pain room post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PainRoom"

  /pain-rooms/{painRoomId}/breakdowns:
    post:
      operationId: addBreakdown
      tags: [pain-rooms]
      summary: Add a structured breakdown to a pain room post
      parameters:
        - name: painRoomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBreakdownBody"
      responses:
        "201":
          description: Breakdown added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownFull"

  /pain-rooms/{painRoomId}/resolve/{breakdownId}:
    post:
      operationId: resolveBreakdown
      tags: [pain-rooms]
      summary: Mark a breakdown as the one that helped
      parameters:
        - name: painRoomId
          in: path
          required: true
          schema:
            type: integer
        - name: breakdownId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /pain-rooms/{painRoomId}/like:
    post:
      operationId: likePainRoom
      tags: [pain-rooms]
      summary: Like a pain room post
      parameters:
        - name: painRoomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema:
                type: object
                properties:
                  likeCount:
                    type: integer
                required: [likeCount]

  /breakdowns/{breakdownId}/like:
    post:
      operationId: likeBreakdown
      tags: [pain-rooms]
      summary: Like a breakdown response
      parameters:
        - name: breakdownId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema:
                type: object
                properties:
                  likeCount:
                    type: integer
                required: [likeCount]

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get crowd analytics summary (crowd positions, leverage dist)
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/market:
    get:
      operationId: getAnalyticsMarket
      tags: [analytics]
      summary: Get analytics market data (legacy)
      responses:
        "200":
          description: Market data
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items:
                      type: object
                required: [prices]

  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Get live market prices from Sodex testnet
      responses:
        "200":
          description: Live market prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPricesResponse"

  /market/news:
    get:
      operationId: getMarketNews
      tags: [market]
      summary: Get crypto news from SoSoValue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: News feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketNewsResponse"

  /market/klines/{symbol}:
    get:
      operationId: getMarketKlines
      tags: [market]
      summary: Get OHLC kline data for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Kline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketKlinesResponse"

  /market/vibe:
    get:
      operationId: getMarketVibe
      tags: [market]
      summary: Get AI-generated market vibe summary with prices and news
      responses:
        "200":
          description: Market vibe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketVibeResponse"

  /market/fills/{symbol}:
    get:
      operationId: getMarketFills
      tags: [market]
      summary: Get recent Sodex testnet market fills (trade executions) for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: "Pair symbol e.g. BTC/USDT"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Recent market fills from Sodex testnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketFillsResponse"

  /trades/verify-sodex:
    post:
      operationId: verifySodexTrade
      tags: [trades]
      summary: Verify a Sodex testnet trade ID against the public fills feed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySodexTradeBody"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifySodexTradeResponse"

  /analytics/whales:
    get:
      operationId: getWhaleActivity
      tags: [analytics]
      summary: Get recent large positions (whale activity)
      responses:
        "200":
          description: Whale activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  whales:
                    type: array
                    items:
                      $ref: "#/components/schemas/WhalePosition"
                required: [whales]

  /intents:
    get:
      operationId: listIntents
      tags: [signals]
      summary: List trade intents (pre-trade setups for validation)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed_hit, closed_miss, expired]
        - name: asset
          in: query
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            enum: [LONG, SHORT]
        - name: traderId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of trade intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIntentsResponse"
    post:
      operationId: createIntent
      tags: [signals]
      summary: Post a new trade intent (pre-trade setup for community validation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntentBody"
      responses:
        "201":
          description: Intent created

  /intents/{intentId}/vote:
    post:
      operationId: voteIntent
      tags: [signals]
      summary: Vote valid or invalid on a trade intent
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteIntentBody"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteIntentResponse"

  /intents/{intentId}/resolve:
    post:
      operationId: resolveIntent
      tags: [signals]
      summary: Resolve an intent as hit or miss, rewarding correct voters
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [hit, miss]
              required: [outcome]
      responses:
        "200":
          description: Intent resolved

  /stream/feed:
    get:
      operationId: streamFeed
      tags: [stream]
      summary: Server-Sent Events stream of realtime activity
      description: |
        Long-lived `text/event-stream` response. Three event types are emitted:

        - `price_tick`  — `{ symbol, displaySymbol, markPrice, changePct24h, ts }`
                          throttled to ~1 Hz per symbol from the live market snapshot.
        - `new_trade`   — `{ tradeId, traderId, username, asset, side, pnlUsd, leverage, ts }`
                          fired when a closed Sodex position is ingested into our `trades` table.
        - `new_signal`  — `{ signalId, traderId, username, asset, side, entryPrice, leverage, ts }`
                          fired when a new open position is ingested into our `signals` table.

        A `: keep-alive` comment is sent every 25s so proxies don't drop the connection.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /accounts/{addr}/state:
    get:
      operationId: getAccountState
      tags: [accounts]
      summary: Combined Sodex balances + positions + open orders for one wallet
      parameters:
        - name: addr
          in: path
          required: true
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
      responses:
        "200":
          description: Aggregated account state passthrough
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:   {}
                  positions:  {}
                  openOrders: {}
                  fetchedAt:  { type: integer }

  /accounts/{addr}/trades:
    get:
      operationId: getAccountTrades
      tags: [accounts]
      summary: Sodex trade execution history for a wallet
      parameters:
        - name: addr
          in: path
          required: true
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Trades passthrough
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items: {}

  /accounts/{addr}/orders:
    get:
      operationId: getAccountOrders
      tags: [accounts]
      summary: Sodex order history for a wallet
      parameters:
        - name: addr
          in: path
          required: true
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Orders passthrough
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: {}

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top traders ranked by 30d PNL
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  traders:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry"
                required: [traders]

